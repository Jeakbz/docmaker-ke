<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Maker Kenya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-lg w-full bg-white rounded-xl shadow-md p-6 my-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Kenya AI Document Maker</h1>
        <p class="text-sm text-gray-600 mb-6">Generate legal contracts & agreements instantly in PDF format.</p>
        
        <form method="POST" action="" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700">Document Type</label>
                <select name="doc_type" class="w-full mt-1 p-2 border border-gray-300 rounded-md">
                    <option value="Residential Tenancy Agreement Kenya">Residential Tenancy Agreement</option>
                    <option value="Employment Contract Kenya">Employment Contract</option>
                    <option value="Non-Disclosure Agreement (NDA) Kenya">Non-Disclosure Agreement (NDA)</option>
                    <option value="Business Proposal Youth Fund Kenya">Youth/Uwezo Fund Business Proposal</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">First Party Name (e.g., Landlord / Employer)</label>
                <input type="text" name="party_a" required placeholder="John Doe" class="w-full mt-1 p-2 border border-gray-300 rounded-md">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Second Party Name (e.g., Tenant / Employee)</label>
                <input type="text" name="party_b" required placeholder="Jane Smith" class="w-full mt-1 p-2 border border-gray-300 rounded-md">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Terms / Rent / Salary / Duration</label>
                <textarea name="details" rows="3" placeholder="e.g. Monthly rent KES 15,000 payable on the 1st of every month." class="w-full mt-1 p-2 border border-gray-300 rounded-md"></textarea>
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md shadow transition">
                Generate & Download PDF
            </button>
        </form>
    </div>
</body>
</html>
